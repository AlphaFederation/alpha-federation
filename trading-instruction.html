<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090a0c">
  <meta name="description" content="Alpha Federation Trading Instructions: learn disciplined market analysis, risk management, trade planning and portfolio protection.">

  <title>Trading Instructions | Alpha Federation</title>

  <style>
    :root {
      --bg: #090a0c;
      --panel: #111316;
      --panel-2: #17191c;
      --gold: #c9a45d;
      --gold-light: #e5cb8b;
      --text: #f5f0e5;
      --muted: #aaa9a3;
      --line: rgba(201, 164, 93, .23);
      --max: 1160px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 95px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .container {
      width: min(var(--max), calc(100% - 40px));
      margin-inline: auto;
    }

    .gold { color: var(--gold-light); }

    .eyebrow {
      color: var(--gold-light);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1, h2, h3 {
      line-height: 1.2;
      letter-spacing: -.025em;
    }

    h1 { font-size: clamp(2.5rem, 6vw, 5rem); }
    h2 { font-size: clamp(1.8rem, 3.5vw, 2.7rem); }
    h3 { font-size: 1.12rem; }

    .muted { color: var(--muted); }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(9, 10, 12, .94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 10px;
      color: #111;
      background: linear-gradient(145deg, #ebd69f, #b68b42);
      font-size: 1.35rem;
      font-weight: 900;
    }

    .brand-name {
      color: var(--gold-light);
      font-size: .96rem;
      font-weight: 800;
      letter-spacing: .07em;
    }

    .brand-sub {
      display: block;
      color: var(--muted);
      font-size: .63rem;
      letter-spacing: .18em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
      font-size: .85rem;
      color: #d2cfc7;
    }

    .nav-links a:hover { color: var(--gold-light); }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 11px 19px;
      border: 1px solid var(--gold);
      border-radius: 7px;
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, background .2s, border-color .2s;
    }

    .button:hover { transform: translateY(-2px); }

    .button-primary {
      color: #17130c;
      background: linear-gradient(135deg, #e4ca8a, #bb9148);
      border-color: transparent;
    }

    .button-outline {
      color: var(--gold-light);
      background: transparent;
    }

    .button-outline:hover { background: rgba(201,164,93,.09); }

    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(ellipse at 82% 15%, rgba(173,126,43,.15), transparent 38%),
        linear-gradient(180deg, #0b0c0e, #090a0c);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 52px;
      padding-top: 75px;
      padding-bottom: 75px;
    }

    .hero h1 { margin: 18px 0; }
    .hero h1 span { color: var(--gold-light); }

    .hero-copy {
      max-width: 570px;
      color: #b9b8b1;
      font-size: 1.05rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .hero-note {
      margin-top: 24px;
      color: #898980;
      font-size: .79rem;
    }

    .hero-image {
      position: relative;
      min-height: 390px;
      overflow: hidden;
      border: 1px solid rgba(201,164,93,.35);
      border-radius: 14px;
      background:
        linear-gradient(0deg, rgba(8,9,11,.45), transparent 55%),
        url("assets/trading-hero.jpg") center / cover no-repeat,
        #15171a;
      box-shadow: 0 25px 80px rgba(0,0,0,.35);
    }

    .image-label {
      position: absolute;
      right: 18px;
      bottom: 18px;
      left: 18px;
      padding: 14px 16px;
      border: 1px solid rgba(201,164,93,.28);
      border-radius: 8px;
      background: rgba(9,10,12,.84);
      backdrop-filter: blur(8px);
    }

    .image-label strong {
      display: block;
      color: var(--gold-light);
      font-size: .86rem;
    }

    .image-label span {
      color: #c1beb5;
      font-size: .77rem;
    }

    .section { padding: 82px 0; }

    .section-heading {
      max-width: 720px;
      margin-bottom: 35px;
    }

    .section-heading h2 { margin: 10px 0 15px; }

    .section-heading p {
      color: var(--muted);
      margin-bottom: 0;
    }

    .pillars {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
    }

    .card {
      padding: 25px;
      border: 1px solid #292a2c;
      border-radius: 11px;
      background: linear-gradient(145deg, #141619, #0e1012);
      transition: border-color .2s, transform .2s;
    }

    .card:hover {
      border-color: rgba(201,164,93,.6);
      transform: translateY(-3px);
    }

    .card-number {
      color: var(--gold);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .card h3 { margin: 15px 0 10px; }

    .card p {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 0;
    }

    .guide-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr);
      align-items: start;
      gap: 35px;
    }

    .guide-list {
      display: grid;
      gap: 13px;
    }

    details {
      border: 1px solid #2c2b27;
      border-radius: 9px;
      background: var(--panel);
    }

    details[open] { border-color: rgba(201,164,93,.55); }

    summary {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 19px;
      cursor: pointer;
      list-style: none;
      font-weight: 700;
    }

    summary::-webkit-details-marker { display: none; }

    summary::after {
      content: "+";
      margin-left: auto;
      color: var(--gold-light);
      font-size: 1.35rem;
    }

    details[open] summary::after { content: "−"; }

    .summary-number {
      color: var(--gold-light);
      font-size: .78rem;
      letter-spacing: .08em;
    }

    .detail-content {
      padding: 0 20px 20px;
      color: var(--muted);
      font-size: .91rem;
    }

    .detail-content li { margin: 9px 0; }
    .detail-content strong { color: #e7dfce; }

    .side-panel {
      position: sticky;
      top: 100px;
      padding: 27px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background:
        radial-gradient(ellipse at top right, rgba(201,164,93,.09), transparent 60%),
        #111214;
    }

    .side-panel h3 { margin-bottom: 12px; }

    .side-panel p, .side-panel li {
      color: var(--muted);
      font-size: .88rem;
    }

    .side-panel ul { padding-left: 20px; }

    .rule {
      height: 1px;
      margin: 22px 0;
      background: var(--line);
    }

    .calculator-section {
      border-top: 1px solid #28251e;
      border-bottom: 1px solid #28251e;
      background:
        radial-gradient(ellipse at 85% 10%, rgba(201,164,93,.07), transparent 38%),
        #0d0e10;
    }

    .calculator {
      max-width: 850px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      padding: 28px;
      border: 1px solid #34302a;
      border-radius: 13px;
      background: #121416;
    }

    .field { display: grid; gap: 7px; }

    .field label {
      color: #ded8ca;
      font-size: .84rem;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      min-height: 47px;
      padding: 11px 13px;
      color
